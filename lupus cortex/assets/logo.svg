<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 130" role="img" aria-label="Lupus Cortex">
  <defs>
    <linearGradient id="lcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#e2e8f0"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="lcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .lc-word {
      font-family: 'Orbitron', 'Audiowide', 'Segoe UI', system-ui, sans-serif;
      font-weight: 700;
      font-size: 56px;
      letter-spacing: 8px;
      fill: url(#lcGrad);
      text-anchor: middle;
    }
  </style>

  <g filter="url(#lcGlow)">
    <text class="lc-word" x="160" y="58">LUPUS</text>
    <text class="lc-word" x="160" y="118">CORTEX</text>
  </g>
</svg>
